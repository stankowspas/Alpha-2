[project]
name = "alpha2-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.12,<4",
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "httpx>=0.28,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
