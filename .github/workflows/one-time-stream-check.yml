name: One-time Cloudflare Streaming Endpoint Check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  live-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check deployed version, CORS and model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -D /tmp/head -o /tmp/status \
            --max-time 25 -H "Origin: https://stankowspas.github.io" \
            "https://alpha2-cloud-ai-test.stankowspas.workers.dev/api/status"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/status'))
          assert x['revision']=='stream-fix-2026-11-19',x
          assert x['available'] is True,x
          assert x['rateLimited'] is False,x
          assert x['model']=='@cf/google/gemma-4-26b-a4b-it',x
          assert 'access-control-allow-origin: https://stankowspas.github.io' in open('/tmp/head').read().lower()
          print('Deployed revision / CORS / AI binding: OK',x)
          PY
      - name: Verify actual Bulgarian answer from streamed Worker
        shell: bash
        run: |
          set -euo pipefail
          for test in 1 2; do
            if [ "$test" = 1 ]; then
              payload='{"messages":[{"role":"user","content":"Отговори на български: колко е 17 плюс 23? Напиши кратък отговор."}]}'
            else
              payload='{"messages":[{"role":"user","content":"Отговори с три кратки изречения на български за значението на резервните копия на данни."}]}'
            fi
            status=$(curl --silent --show-error --max-time 95 \
              -H "Content-Type: application/json" \
              -H "Origin: https://stankowspas.github.io" \
              --data "$payload" -o /tmp/live.json -w '%{http_code}' \
              https://alpha2-cloud-ai-test.stankowspas.workers.dev/api/chat)
            echo "Test $test: HTTP $status"
            python3 - <<'PY'
          import json
          p=json.load(open('/tmp/live.json'))
          print('Response keys:',list(p))
          print('Error:',str(p.get('error',''))[:300])
          print('Length:',len(p.get('answer','')))
          print('Elapsed ms:',p.get('elapsedMs'))
          assert isinstance(p.get('answer'),str) and len(p['answer'].strip())>8,p
          assert p['model']=='@cf/google/gemma-4-26b-a4b-it'
          PY
            [ "$status" = 200 ]
          done
