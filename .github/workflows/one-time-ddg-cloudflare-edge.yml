name: One-time DuckDuckGo Lite Cloudflare Edge Probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-edge-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy disposable isolated Cloudflare Worker with temporary credentials
        run: |
          set -euo pipefail
          # The log can contain a claim-token bearer URL. Never print it.
          npx --yes wrangler@latest deploy .github/ddg-edge-probe.mjs \
            --name alpha2-ddg-feasibility \
            --compatibility-date 2026-11-19 \
            --temporary > /tmp/temporary-deploy.log 2>&1 || {
              echo "Temporary Cloudflare deployment failed (output withheld to protect claim tokens)"
              exit 1
            }
          node - <<'JS'
          const fs = require('node:fs');
          const log = fs.readFileSync('/tmp/temporary-deploy.log','utf8');
          const matches = log.match(/https:\/\/[a-zA-Z0-9.-]+\.workers\.dev\b/g) || [];
          if (matches.length===0) {console.error('No temporary workers.dev URL was returned');process.exit(1);}
          fs.writeFileSync('/tmp/edge-probe-url',matches.at(-1));
          console.log('Temporary Worker deployed to host:',new URL(matches.at(-1)).hostname);
          JS
      - name: Request actual Cloudflare edge execution and inspect results
        run: |
          set -euo pipefail
          URL=$(cat /tmp/edge-probe-url)
          STATUS=000
          for attempt in 1 2 3 4 5 6 7 8; do
            STATUS=$(curl --silent --show-error --max-time 45 -w '%{http_code}' \
              "$URL/" -o /tmp/edge-probe.json) || STATUS=000
            echo "Cloudflare temporary Worker reachability attempt $attempt: HTTP $STATUS"
            if [ "$STATUS" = 200 ]; then break; fi
            sleep 5
          done
          if [ "$STATUS" != 200 ]; then
            echo "Cloudflare temporary Worker route not reachable after retries"
            python3 - <<'PYRESPONSE'
          from pathlib import Path
          p=Path('/tmp/edge-probe.json')
          print('HTTP response preview:',p.read_text(errors='replace')[:350] if p.exists() else 'missing')
          PYRESPONSE
            exit 1
          fi
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/edge-probe.json'))
          print('Execution environment:',x.get('environment'))
          for row in x.get('observations',[]):
              print('METHOD',row.get('method'),'HTTP',row.get('status'),'LINKS',row.get('results'),'CHALLENGE',row.get('challenged'),'ERROR',row.get('error',''))
          assert x.get('environment')=='Cloudflare Workers temporary edge'
          assert len(x.get('observations',[]))==2
          # Do not assert nonempty search results: reachability vs reliability is precisely what we measure.
          PY
