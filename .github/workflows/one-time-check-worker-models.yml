name: One-time verify live 3 model Worker
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production status and 3 tiny model requests
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          base="https://alpha2-cloud-ai-test.stankowspas.workers.dev"
          def call(path, data=None):
            raw=None if data is None else json.dumps(data).encode()
            req=urllib.request.Request(base+path,data=raw,headers={"Origin":"https://stankowspas.github.io","User-Agent":"Alpha2-live-smoke/1.0",**({"Content-Type":"application/json"} if raw else {})},method="POST" if raw else "GET")
            try:
              with urllib.request.urlopen(req,timeout=45) as res:
                body=res.read(32000).decode("utf-8","replace")
                return res.status,json.loads(body)
            except urllib.error.HTTPError as e:
              return e.code,json.loads(e.read(32000).decode("utf-8","replace"))
          status,data=call("/api/status")
          print("STATUS",status,json.dumps({k:v for k,v in data.items() if k in ["available","model","revision","searchAvailable","models"]},ensure_ascii=False))
          assert status==200,"Status endpoint failed"
          assert data.get("revision")=="multi-free-2026-11-20","New Worker not deployed"
          assert data.get("available"),"Gemma Worker AI unavailable"
          assert all(x.get("available") for x in data.get("models",[])) and len(data.get("models",[]))==3,"One or more model keys are not configured"
          for name in ["gemma4","gpt-oss-120b","gemini-flash-lite"]:
            code,out=call("/api/chat",{"model":name,"messages":[{"role":"user","content":"Отговори с една дума: колко е 2+2?"}],"webSearch":"off"})
            print("MODEL TEST",name,"HTTP",code,"ANSWER",repr(out.get("answer","")[:140]),"ERROR",repr(out.get("error","")[:240]))
          PY
