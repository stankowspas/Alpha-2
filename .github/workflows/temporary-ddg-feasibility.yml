name: Temporary DuckDuckGo Connectivity Feasibility
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-external-search:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check HTML and Lite endpoints without bypasses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib import request,parse,error,robotparser
          from html.parser import HTMLParser
          import re
          AGENT='Alpha2FeasibilityTest/1.0 (technical connectivity assessment)'
          class Extract(HTMLParser):
              def __init__(self):
                  super().__init__();self.links=[];self.rejected=False
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='a' and ('result__a' in d.get('class','') or 'result-link' in d.get('class','')):
                      self.links.append(d.get('href',''))
          for domain,endpoint in [('html.duckduckgo.com','html/'),('lite.duckduckgo.com','lite/')]:
              print('===',domain,flush=True)
              robot_url='https://'+domain+'/robots.txt'
              try:
                  with request.urlopen(request.Request(robot_url,headers={'User-Agent':AGENT}),timeout=18) as resp:
                      robots=resp.read(100000).decode('utf-8',errors='replace')
                      print('robots status',resp.status,'chars',len(robots))
                  p=robotparser.RobotFileParser();p.parse(robots.splitlines())
                  target='https://'+domain+'/'+endpoint
                  if not p.can_fetch(AGENT,target+'?q=cloudflare+workers'):
                      print('ROBOTS_DISALLOW: search path not requested')
                      continue
              except Exception as ex:
                  print('ROBOTS_UNVERIFIED',type(ex).__name__,str(ex)[:160],flush=True)
                  continue
              for method in ['GET','POST']:
                  url='https://'+domain+'/'+endpoint
                  query=parse.urlencode({'q':'Cloudflare Workers docs'})
                  if method=='GET': url+='?'+query;body=None
                  else: body=query.encode('utf-8')
                  headers={'User-Agent':AGENT,'Accept':'text/html','Accept-Language':'en-US,en;q=0.9'}
                  if method=='POST': headers['Content-Type']='application/x-www-form-urlencoded'
                  req=request.Request(url,data=body,headers=headers,method=method)
                  try:
                      with request.urlopen(req,timeout=23) as resp:
                          blob=resp.read(400000);status=resp.status;location=resp.url;ctype=resp.headers.get('Content-Type','')
                  except error.HTTPError as ex:
                      blob=ex.read(400000);status=ex.code;location=ex.url;ctype=ex.headers.get('Content-Type','')
                  except Exception as ex:
                      print(method,'REQUEST_ERROR',type(ex).__name__,str(ex)[:160],flush=True)
                      continue
                  html=blob.decode('utf-8',errors='replace')
                  parser=Extract();parser.feed(html)
                  blocked=bool(re.search(r'anomaly-modal|bot detection|captcha|unusual traffic|blocked',html,re.I))
                  print(method,'HTTP',status,'bytes',len(blob),'content-type',ctype,'final-host',parse.urlparse(location).netloc,'result-links',len(parser.links),'challenge-marker',blocked,flush=True)
                  print('response-title',re.search(r'<title[^>]*>(.*?)</title>',html,re.I|re.S).group(1)[:130] if re.search(r'<title[^>]*>(.*?)</title>',html,re.I|re.S) else 'N/A',flush=True)
          PY
