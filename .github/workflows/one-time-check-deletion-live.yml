name: Temporary audit published Alpha 2 delete chat UI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check production HTML JS CSS and service worker content
        run: |
          python3 - <<'PY'
          import re,time,urllib.request,urllib.parse
          base='https://stankowspas.github.io/Alpha-2/'
          def get(path):
            url=urllib.parse.urljoin(base,path)
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Pragma':'no-cache'})
            with urllib.request.urlopen(req,timeout=25) as r:
              text=r.read().decode('utf-8','replace')
              print('HTTP',r.status,'url',url,'age',r.headers.get('Age'),'cache-control',r.headers.get('Cache-Control'),'bytes',len(text))
              return text
          html=get('./?check-delete-ui='+str(int(time.time())))
          js=re.findall(r'<script[^>]+src="([^"]+)"',html)
          css=re.findall(r'<link[^>]+href="([^"]+\.css)"',html)
          print('JS assets:',js)
          print('CSS assets:',css)
          assert js and css,'No script or CSS in published HTML'
          for path in js:
            script=get(path)
            print('PUBLISHED JS HAS delete chat button:',bool('delete-chat' in script))
            print('PUBLISHED JS HAS confirmation string:',bool('Действието е необратимо' in script))
            print('PUBLISHED JS HAS IndexedDB clear:',bool('conversationId' in script))
            assert 'delete-chat' in script,'Deployed JS does not include delete button'
          for path in css:
            style=get(path)
            print('PUBLISHED CSS HAS trash button style:',bool('.delete-chat' in style))
            assert '.delete-chat' in style,'Deployed CSS missing delete button styling'
          sw=get('./sw.js?check='+str(int(time.time())))
          print('Service worker v16:',bool('v16' in sw))
          assert 'v16' in sw,'Service worker stale'
          print('ALL DEPLOYED ASSETS CONTAIN DELETE UI')
          PY

      - name: Render chat sidebar in a real Chromium browser
        shell: bash
        run: |
          mkdir -p /tmp/alpha2-browser-test
          cd /tmp/alpha2-browser-test
          npm install --no-audit --no-fund --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
          node - <<'JS'
          const { chromium }=require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true,args:["--no-sandbox"]});
            const page=await browser.newPage({viewport:{width:1365,height:768}});
            page.on('pageerror', err=>console.log("Page error:",err.message));
            const res=await page.goto("https://stankowspas.github.io/Alpha-2/?browser-check="+Date.now(),{waitUntil:"networkidle",timeout:60000});
            await page.waitForSelector(".conversation-list .conversation-row",{timeout:30000});
            const result=await page.evaluate(()=>{
              const rows=[...document.querySelectorAll(".conversation-row")];
              return {pageTitle:document.title,swControlled:!!navigator.serviceWorker?.controller,
                rows:rows.length,
                buttons:rows.map(r=>{
                  const b=r.querySelector("button.delete-chat");
                  const s=b?getComputedStyle(b):null;
                  const rect=b?.getBoundingClientRect();
                  return {title:r.querySelector(".conversation-title")?.textContent,
                    exists:!!b,visible:!!b&&s?.display!=="none"&&s?.visibility!=="hidden"&&(rect?.width??0)>0&&(rect?.height??0)>0,
                    cssDisplay:s?.display,rect:rect?{x:rect.x,y:rect.y,width:rect.width,height:rect.height}:null,
                    label:b?.getAttribute("aria-label"),opacity:s?.opacity};
                })};
            });
            console.log("CHROMIUM RESULT",JSON.stringify(result));
            if(!result.rows || !result.buttons.every(b=>b.visible)) throw Error("Delete control not visibly rendered");
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
