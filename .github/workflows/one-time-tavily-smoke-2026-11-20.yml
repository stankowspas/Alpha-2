name: One-time Tavily production smoke test
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify Tavily search and Gemma 4 in production (no keys)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, sys
          base="https://alpha2-cloud-ai-test.stankowspas.workers.dev"
          def request(path, data=None):
              body=json.dumps(data,ensure_ascii=False).encode("utf-8") if data is not None else None
              headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131.0.0.0","Accept":"application/json","Origin":"https://stankowspas.github.io"}
              if data is not None: headers["Content-Type"]="application/json"
              req=urllib.request.Request(base+path,data=body,headers=headers,method="POST" if data is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=105) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try:
                      raw=e.read(1200).decode("utf-8","replace")
                      print("HTTP error body (first 300 characters):",raw[:300])
                      payload=json.loads(raw)
                  except Exception: payload={"error":"non-JSON HTTP error"}
                  return e.code,payload
          status,data=request("/api/status")
          print("Status endpoint:",status)
          print("Model:",data.get("model"))
          print("Revision:",data.get("revision"))
          print("Search configured:",data.get("searchAvailable"))
          assert status==200 and data.get("available") is True
          assert data.get("searchAvailable") is True
          payload={"messages":[{"role":"user","content":"Според официалния сайт на NASA, какво е Artemis II? Отговори с едно изречение."}],"webSearch":"on"}
          code,data=request("/api/chat",payload)
          search=data.get("webSearch") or {}
          sources=search.get("sources") or []
          answer=data.get("answer") or ""
          print("Chat HTTP:",code)
          print("Search used:",search.get("used"))
          print("Number of sources:",len(sources))
          print("Answer length:",len(answer))
          print("Search warning:",search.get("warning"))
          for source in sources[:5]:
              print("Source title:",str(source.get("title",""))[:160])
              print("Source URL:",str(source.get("url",""))[:250])
          if code!=200:
              print("Error:",str(data.get("error",""))[:350])
          assert code==200,"Chat API did not return 200"
          assert search.get("used") is True,"Tavily not used"
          assert len(sources)>0,"No Tavily sources"
          assert all(str(s.get("url","")).startswith(("https://","http://")) for s in sources),"Invalid source URLs"
          assert len(answer.strip())>20,"Gemma did not return substantive answer"
          print("LIVE TAVILY SEARCH AND GEMMA GENERATION: PASS")
          PY
