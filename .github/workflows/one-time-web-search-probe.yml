name: One-time check Tavily search across free models
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Probe via actual browser origin to distinguish Cloudflare bot protection
        shell: bash
        run: |
          mkdir -p /tmp/alpha2-live-browser && cd /tmp/alpha2-live-browser
          npm install --no-audit --no-fund --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
          node - <<'JS'
          const {chromium}=require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true,args:["--no-sandbox"]});
            const page=await browser.newPage({viewport:{width:1365,height:800}});
            const errors=[];
            page.on("pageerror",e=>errors.push(e.message));
            await page.goto("https://stankowspas.github.io/Alpha-2/?search-probe="+Date.now(),{waitUntil:"domcontentloaded",timeout:45000});
            console.log("BROWSER PAGE TITLE",await page.title());
            const cases=[
              ["gemma4","on"],
              ["gpt-oss-120b","on"],
              ["gemini-flash-lite","on"],
              ["gpt-oss-120b","auto"]
            ];
            for(const [model,webSearch] of cases){
              const out=await page.evaluate(async (model,webSearch)=>{
                const response=await fetch("https://alpha2-cloud-ai-test.stankowspas.workers.dev/api/chat",{
                  method:"POST",headers:{"Content-Type":"application/json"},
                  body:JSON.stringify({model,webSearch,messages:[{role:"user",content:"Провери в интернет официалния сайт на Python и посочи URL адреса."}]})
                });
                const raw=await response.text();
                let result;try{result=JSON.parse(raw)}catch{result={error:"Non-JSON response: "+raw.slice(0,180)}}
                return {http:response.status,used:result.webSearch?.used??false,sources:result.webSearch?.sources?.length??0,links:result.webSearch?.sources?.slice(0,2).map(x=>x.url)??[],answer:result.answer?.slice(0,500),error:result.error??null};
              },model,webSearch);
              console.log("SEARCH",model,webSearch,JSON.stringify(out));
            }
            console.log("JS errors",errors.slice(0,4));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
